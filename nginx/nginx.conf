# Al Ramlah Travels — Hardened Nginx Reverse Proxy Configuration
# Terminates/forwards HTTPS traffic cleanly to Next.js 16 standalone server

worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    client_max_body_size 25m;

    # Preserve upstream TLS X-Forwarded-Proto if behind Cloudflare/ALB, else $scheme
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # Proper HTTP/1.1 keepalive vs WebSocket upgrade Connection header
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    # Rate-limiting zones for authentication and API routes
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    upstream al_ramlah_nextjs {
        server 127.0.0.1:3000 max_fails=3 fail_timeout=15s;
        keepalive 64;
    }

    # Port 80 -> HTTPS 301 Redirect (with local container liveness bypass)
    server {
        listen 80;
        server_name _;

        location = /api/health {
            proxy_pass http://al_ramlah_nextjs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_read_timeout 5s;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Canonical www -> apex HTTPS 301 Redirect (OD-10, SEO-008)
    server {
        listen 80;
        listen 443 ssl;
        http2 on;
        server_name www.alramlahtravels.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        return 301 https://alramlahtravels.com$request_uri;
    }

    # Primary HTTPS Reverse Proxy Server (Apex Domain)
    server {
        listen 443 ssl;
        http2 on;
        server_name alramlahtravels.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # Baseline Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

        # Next.js immutable static chunks (repeat security headers due to Nginx add_header inheritance rules)
        location /_next/static/ {
            proxy_pass http://al_ramlah_nextjs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # Rate-limited Better Auth endpoints
        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://al_ramlah_nextjs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 30s;
        }

        # Main application reverse proxy
        location / {
            proxy_pass http://al_ramlah_nextjs;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;

            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
