# Al Ramlah Travels — Nginx Reverse Proxy Configuration
# Proxies incoming HTTP traffic on port 80 to the Next.js 16 server on localhost:3000

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 25M;

    # Gzip compression for faster public loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    upstream al_ramlah_nextjs {
        server 127.0.0.1:3000;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Next.js static asset caching (immutable, 1 year)
        location /_next/static/ {
            proxy_pass http://al_ramlah_nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # Main application reverse proxy
        location / {
            proxy_pass http://al_ramlah_nextjs;
            proxy_http_version 1.1;

            # WebSocket / HMR & Next.js Server Actions headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400;
        }
    }
}
